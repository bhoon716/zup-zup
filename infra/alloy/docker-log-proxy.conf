load_module /usr/lib/nginx/modules/ngx_http_js_module.so;

user root;
worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    access_log off;
    server_tokens off;
    js_import docker_guard from /etc/nginx/docker-log-guard.js;

    upstream docker_engine {
        server unix:/var/run/docker.sock;
    }

    server {
        listen 2375;
        proxy_http_version 1.1;
        proxy_set_header Host localhost;
        proxy_set_header Connection "";
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
        proxy_buffering off;
        proxy_read_timeout 1h;

        location ~ "^/(?:v[0-9]+\.[0-9]+/)?containers/json$" {
            limit_except GET { deny all; }
            proxy_pass http://docker_engine$uri?filters=%7B%22label%22%3A%5B%22com.docker.compose.project%3Dsugang-helper%22%5D%7D;
        }

        location ~ "^/(?:v[0-9]+\.[0-9]+/)?(?:_ping|version|networks)$" {
            limit_except GET { deny all; }
            proxy_pass http://docker_engine$uri$is_args$args;
        }

        location ~ "^/(?:v[0-9]+\.[0-9]+/)?containers/(?<container_id>[a-f0-9]{64})/(?<operation>json|logs)$" {
            limit_except GET { deny all; }
            js_content docker_guard.container;
        }

        location /_docker_inspect/ {
            internal;
            proxy_buffering on;
            subrequest_output_buffer_size 256k;
            proxy_pass http://docker_engine/containers/;
        }

        location /_docker_logs/ {
            internal;
            proxy_pass http://docker_engine/containers/;
        }

        location / {
            return 404;
        }
    }
}
