services:
  npm:
    image: jc21/nginx-proxy-manager@sha256:2aa69b382a384b676c0d4f1d6f2eac40ecd478fcf7af1cfb3f9f1d3cd0c81e12
    container_name: sugang-helper-npm
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
    ports:
      - "80:80"
      - "127.0.0.1:81:81"
      - "443:443"
    volumes:
      - /home/ubuntu/jbnu-sugang-helper/infra/npm/data:/data
      - /home/ubuntu/jbnu-sugang-helper/infra/npm/letsencrypt:/etc/letsencrypt
    networks:
      edge:
        aliases: [nginx-proxy-manager]
      runtime: {}
networks:
  edge:
    external: true
    name: sugang-helper-network-server
  runtime:
    external: true
    name: sugang-helper-runtime
