global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - file_sd_configs:
        - files: [/etc/prometheus/alertmanager-targets.json]
          refresh_interval: 30s

scrape_configs:
  - job_name: sugang-helper-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - app:8081

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: alertmanager
    file_sd_configs:
      - files: [/etc/prometheus/alertmanager-targets.json]
        refresh_interval: 30s
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
  - job_name: host-jobs
    metrics_path: /api/v0/component/prometheus.exporter.unix.host_jobs/metrics
    static_configs:
      - targets: ["alloy:12345"]
