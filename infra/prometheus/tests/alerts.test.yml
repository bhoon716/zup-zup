  - name: "OutboxMonitor stalled"
    interval: 1m
    input_series:
      - series: "up{job=\"sugang-helper-app\"}"
        values: "1x12"
      - series: "notification_outbox_monitor_last_success_timestamp_seconds{job=\"sugang-helper-app\"}"
        values: "1x12"
    alert_rule_test:
      - eval_time: 10m
        alertname: OutboxMonitorStale
        exp_alerts:
          - exp_labels:
              job: "sugang-helper-app"
              severity: "warning"
            exp_annotations:
              summary: "알림 대기열 점검이 실패했거나 3분 이상 갱신되지 않았습니다."
  - name: "OutboxMonitor missing"
    interval: 1m
    input_series:
      - series: "up{job=\"sugang-helper-app\"}"
        values: "1x12"
    alert_rule_test:
      - eval_time: 10m
        alertname: OutboxMonitorStale
        exp_alerts:
          - exp_labels:
              job: "sugang-helper-app"
              severity: "warning"
            exp_annotations:
              summary: "알림 대기열 점검이 실패했거나 3분 이상 갱신되지 않았습니다."
  - name: "OutboxMonitor healthy"
    interval: 1m
    input_series:
      - series: "up{job=\"sugang-helper-app\"}"
        values: "1x12"
      - series: "notification_outbox_monitor_last_success_timestamp_seconds{job=\"sugang-helper-app\"}"
        values: "0+60x12"
      - series: "notification_outbox_monitor_healthy{job=\"sugang-helper-app\"}"
        values: "1x12"
    alert_rule_test:
      - eval_time: 10m
        alertname: OutboxMonitorStale
        exp_alerts: []
  - name: "OutboxMonitor failed"
    interval: 1m
    input_series:
      - series: "up{job=\"sugang-helper-app\"}"
        values: "1x12"
      - series: "notification_outbox_monitor_last_success_timestamp_seconds{job=\"sugang-helper-app\"}"
        values: "0+60x12"
      - series: "notification_outbox_monitor_healthy{job=\"sugang-helper-app\"}"
        values: "0x12"
    alert_rule_test:
      - eval_time: 10m
        alertname: OutboxMonitorStale
        exp_alerts:
          - exp_labels:
              job: "sugang-helper-app"
              severity: "warning"
            exp_annotations:
              summary: "알림 대기열 점검이 실패했거나 3분 이상 갱신되지 않았습니다."
