rule_files:
  - ../rules/alerts.yml
evaluation_interval: 1m
tests:
  - name: "sugang-helper-app down"
    interval: 1m
    input_series:
      - series: "up{job=\"sugang-helper-app\"}"
        values: "0x12"
    alert_rule_test:
      - eval_time: 10m
        alertname: ApplicationMetricsUnavailable
        exp_alerts:
          - exp_labels:
              job: "sugang-helper-app"
              severity: "critical"
            exp_annotations:
              summary: "앱 메트릭 수집이 중단되었습니다."
  - name: "sugang-helper-app absent"
    interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 10m
        alertname: ApplicationMetricsUnavailable
        exp_alerts:
          - exp_labels:
              job: "sugang-helper-app"
              severity: "critical"
            exp_annotations:
              summary: "앱 메트릭 수집이 중단되었습니다."
  - name: "sugang-helper-app healthy"
    interval: 1m
    input_series:
      - series: "up{job=\"sugang-helper-app\"}"
        values: "1x12"
    alert_rule_test:
      - eval_time: 10m
        alertname: ApplicationMetricsUnavailable
        exp_alerts: []
  - name: "sugang-helper-app brief failure"
    interval: 1m
    input_series:
      - series: "up{job=\"sugang-helper-app\"}"
        values: "1 0 1x10"
    alert_rule_test:
      - eval_time: 2m
        alertname: ApplicationMetricsUnavailable
        exp_alerts: []
  - name: "sugang-helper-app recovered"
    interval: 1m
    input_series:
      - series: "up{job=\"sugang-helper-app\"}"
        values: "0x4 1x8"
    alert_rule_test:
      - eval_time: 10m
        alertname: ApplicationMetricsUnavailable
        exp_alerts: []
  - name: "loki down"
