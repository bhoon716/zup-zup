  - name: "CrawlerFreshnessCheck healthy"
    interval: 1m
    input_series:
      - series: "up{job=\"sugang-helper-app\"}"
        values: "1x12"
      - series: "crawler_data_freshness_check_last_success_timestamp_seconds{job=\"sugang-helper-app\"}"
        values: "0+60x12"
      - series: "crawler_data_freshness_check_healthy{job=\"sugang-helper-app\"}"
        values: "1x12"
    alert_rule_test:
