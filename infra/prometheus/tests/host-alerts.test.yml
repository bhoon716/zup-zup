rule_files:
  - "../rules/host-alerts.yml"
evaluation_interval: "1m"
tests:
  - name: "missing target"
    interval: "1m"
    input_series: []
    alert_rule_test:
      - eval_time: "5m"
        alertname: "HostJobMetricsUnavailable"
        exp_alerts:
          - exp_labels:
              job: "host-jobs"
              severity: "warning"
            exp_annotations:
              summary: "호스트 주기 작업 지표 수집이 중단되었습니다."
  - name: "down target"
    interval: "1m"
    input_series:
      - series: "up{job=\"host-jobs\"}"
        values: "0x10"
    alert_rule_test:
      - eval_time: "5m"
        alertname: "HostJobMetricsUnavailable"
        exp_alerts:
          - exp_labels:
              job: "host-jobs"
              severity: "warning"
            exp_annotations:
              summary: "호스트 주기 작업 지표 수집이 중단되었습니다."
  - name: "target recovered"
    interval: "1m"
    input_series:
      - series: "up{job=\"host-jobs\"}"
        values: "0x2 1x8"
    alert_rule_test:
      - eval_time: "5m"
        alertname: "HostJobMetricsUnavailable"
        exp_alerts: []
  - name: "corrupt textfile"
    interval: "1m"
    input_series:
      - series: "up{job=\"host-jobs\"}"
        values: "1x1620"
      - series: "node_textfile_scrape_error{job=\"host-jobs\"}"
        values: "1x10"
    alert_rule_test:
      - eval_time: "5m"
        alertname: "HostJobTextfileInvalid"
        exp_alerts:
          - exp_labels:
              job: "host-jobs"
              severity: "warning"
            exp_annotations:
              summary: "호스트 주기 작업 지표 파일을 읽지 못했습니다."
  - name: "release unhealthy"
    interval: "1m"
    input_series:
      - series: "up{job=\"host-jobs\"}"
        values: "1x1620"
      - series: "sugang_host_storage_healthy{job=\"host-jobs\",role=\"docker_data\"}"
        values: "1x10"
      - series: "sugang_host_storage_healthy{job=\"host-jobs\",role=\"release\"}"
        values: "0x10"
    alert_rule_test:
      - eval_time: "5m"
        alertname: "HostStorageUnhealthy"
        exp_alerts:
          - exp_labels:
              job: "host-jobs"
              severity: "warning"
              role: "release"
            exp_annotations:
              summary: "호스트 디스크 또는 inode 여유가 부족하거나 측정할 수 없습니다."
  - name: "release missing"
    interval: "1m"
    input_series:
      - series: "up{job=\"host-jobs\"}"
        values: "1x1620"
      - series: "sugang_host_storage_healthy{job=\"host-jobs\",role=\"docker_data\"}"
        values: "1x10"
    alert_rule_test:
      - eval_time: "5m"
        alertname: "HostStorageUnhealthy"
        exp_alerts:
          - exp_labels:
              job: "host-jobs"
              severity: "warning"
              role: "release"
            exp_annotations:
              summary: "호스트 디스크 또는 inode 여유가 부족하거나 측정할 수 없습니다."
  - name: "docker_data unhealthy"
    interval: "1m"
    input_series:
      - series: "up{job=\"host-jobs\"}"
        values: "1x1620"
      - series: "sugang_host_storage_healthy{job=\"host-jobs\",role=\"release\"}"
        values: "1x10"
      - series: "sugang_host_storage_healthy{job=\"host-jobs\",role=\"docker_data\"}"
        values: "0x10"
    alert_rule_test:
      - eval_time: "5m"
        alertname: "HostStorageUnhealthy"
        exp_alerts:
