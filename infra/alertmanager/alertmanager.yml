global:
  resolve_timeout: 5m
  http_config:
    follow_redirects: false

route:
  receiver: operations-slack
  group_by: [alertname, service, test_id]
  group_wait: 30s
  group_interval: 1m
  repeat_interval: 4h

receivers:
  - name: operations-slack
    slack_configs:
      - api_url_file: /run/secrets/alertmanager_slack_webhook
        send_resolved: true
        title: '{{ if eq .Status "firing" }}[줍줍 문제 발생]{{ end }}{{ if eq .Status "resolved" }}[줍줍 경보 해제]{{ end }} {{ .CommonAnnotations.summary }}'
        fallback: '{{ if eq .Status "firing" }}[줍줍 문제 발생]{{ end }}{{ if eq .Status "resolved" }}[줍줍 경보 해제]{{ end }} {{ .CommonAnnotations.summary }}'
        title_link: ''
        footer: ''
        text: |-
          {{ range .Alerts }}{{ if eq .Status "firing" }}상태: 경보 조건 충족 · 서비스 영향 확인 필요{{ end }}{{ if eq .Status "resolved" }}상태: 감지 조건 해제 · 실제 서비스 복구 여부 별도 확인{{ end }}
          {{ if eq .Labels.severity "critical" }}규칙 등급: 긴급(critical){{ end }}{{ if eq .Labels.severity "warning" }}규칙 등급: 경고(warning){{ end }}{{ if eq .Labels.severity "info" }}규칙 등급: 정보(info){{ end }}
          감지 시각: {{ .StartsAt.Format "2006-01-02 15:04:05Z07:00" }}{{ if eq .Status "resolved" }} · 해제 시각: {{ .EndsAt.Format "2006-01-02 15:04:05Z07:00" }}{{ end }}
          {{ if eq .Labels.task "backup" }}대상: DB·첨부파일 백업{{ end }}{{ if eq .Labels.task "event_backup" }}대상: 중요 사건 로그 백업{{ end }}{{ if eq .Labels.task "storage" }}대상: 서버 저장 공간 점검{{ end }}
          {{ if eq .Status "firing" }}{{ if or (eq .Labels.task "backup") (eq .Labels.alertname "HostBackupStale") }}영향: 최신 복구용 사본을 확보하지 못했을 수 있습니다. 기존 백업이 사라졌다는 뜻은 아닙니다.
          첫 대응: 백업 작업 로그 → 마지막 성공 시각 → 백업 파일·체크섬 확인. 기존 사본은 보존하세요.{{ end }}{{ if or (eq .Labels.task "event_backup") (eq .Labels.alertname "HostEventBackupStale") }}영향: 중요 사건 로그의 장기 보관이 지연될 수 있습니다.
          첫 대응: 로그 내보내기 오류 → 마지막 성공 시각 → 저장 공간 확인.{{ end }}{{ if or (eq .Labels.task "storage") (eq .Labels.alertname "HostStorageUnhealthy") (eq .Labels.alertname "HostStorageCheckStale") }}영향: 파일·DB 기록이나 백업에 문제가 생길 수 있습니다. 지표 누락인지 실제 공간 부족인지 구분해야 합니다.
          첫 대응: 디스크 용량·inode 여유 → 저장 공간 점검 로그 확인. 백업·원본 데이터 임의 삭제 금지.{{ end }}{{ if eq .Labels.alertname "CrawlerDataStale" }}영향: 최신 강의·여석 정보와 빈자리 알림 반영이 지연될 수 있습니다.
          첫 대응: 마지막 수집 성공 시각 → 학교 API 응답 → 수집 실패 로그 확인.{{ end }}{{ if or (eq .Labels.alertname "NotificationReadyBacklogOld") (eq .Labels.alertname "NotificationMaterializationBacklog") }}영향: 사용자에게 빈자리 알림이 늦게 전달될 수 있습니다.
          첫 대응: 가장 오래 대기한 알림 → 발송 작업 상태 → 제공자 오류 확인.{{ end }}{{ if eq .Labels.alertname "ApplicationMetricsUnavailable" }}영향: 앱 상태를 지표로 확인할 수 없습니다. 서비스 전체 장애 여부는 아직 확인되지 않았습니다.
          첫 대응: 앱 상태 확인 경로 → 프로세스 상태 → Prometheus 수집 오류 확인.{{ end }}{{ end }}
          경보 ID: {{ .Labels.alertname }}
          {{ if .Labels.test_id }}점검 ID: {{ .Labels.test_id }}{{ end }}
          {{ end }}
