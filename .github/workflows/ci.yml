name: PR CI

on:
  pull_request:

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: 변경 영역 확인
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      web: ${{ steps.filter.outputs.web }}
      server: ${{ steps.filter.outputs.server }}
      docker_image: ${{ steps.filter.outputs.docker_image }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: filter
        name: 변경 경로 분류
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          infra=false
          web=false
          server=false
          docker_image=false
          while IFS= read -r changed_file; do
            [ -n "${changed_file}" ] || continue
            case "${changed_file}" in
              apps/web/*) web=true ;;
              apps/server/*) server=true ;;
              infra/*|docs/operations/*|docs/decisions/*) infra=true ;;
              .github/workflows/ci.yml)
                infra=true
                web=true
                server=true
                docker_image=true
                ;;
              .github/workflows/*) infra=true ;;
            esac
            case "${changed_file}" in
              apps/server/Dockerfile|apps/server/.dockerignore) docker_image=true ;;
            esac
          done < <(git diff --name-only --diff-filter=ACDMRT "${BASE_SHA}" "${HEAD_SHA}")
          {
            echo "infra=${infra}"
            echo "web=${web}"
            echo "server=${server}"
            echo "docker_image=${docker_image}"
          } >>"${GITHUB_OUTPUT}"

  infra:
    name: Infra 검증
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Shell 문법 및 Infra 계약 검증
        run: |
          bash -n infra/scripts/*.sh
          bash infra/scripts/test-runtime-contract.sh
          bash infra/scripts/test-observability-contract.sh
          bash infra/scripts/test-cd-workflow-contract.sh
          bash infra/scripts/test-app-env-preflight.sh
          bash infra/scripts/test-release-layout-contract.sh
          bash infra/scripts/test-local-app-image-flow.sh
          bash infra/scripts/test-local-compose.sh
          bash infra/scripts/test-redis-auth-state-recovery.sh

  web:
    name: Web 검증
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: 의존성 설치
        working-directory: apps/web
        run: npm ci --legacy-peer-deps

      - name: Lint·unit test·production build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
        run: |
          npm run lint
          npm run test -- --run
          npm run build

  server:
    name: Server 검증
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MYSQL_DATABASE: sugang_helper
      MYSQL_ROOT_PASSWORD: ci-root-password
      FLYWAY_IMAGE: flyway/flyway@sha256:8ace7d9825bb3ad1d6e14ee27b3a830b638ac841ba424b99b2d92aa65a99d484
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/jbnu-sugang-helper/server
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: sugang_helper
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:6-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle
          cache-dependency-path: apps/server/gradle/wrapper/gradle-wrapper.properties

      - name: Fresh database migration
        run: |
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE/apps/server/src/main/resources/db/migration:/flyway/sql:ro" \
            -e FLYWAY_URL="jdbc:mysql://127.0.0.1:3306/sugang_helper?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul" \
            -e FLYWAY_USER=root \
            -e FLYWAY_PASSWORD=ci-root-password \
            -e FLYWAY_BASELINE_ON_MIGRATE=false \
            -e FLYWAY_CLEAN_DISABLED=true \
            "${FLYWAY_IMAGE}" migrate

      - name: Test·static analysis·migration regression·JAR
        working-directory: apps/server
        env:
          AWS_ACCESS_KEY_ID: ci-access-key
          AWS_SECRET_ACCESS_KEY: ci-secret-key
          AWS_REGION: us-east-1
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/sugang_helper?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: ci-root-password
          SPRING_FLYWAY_ENABLED: "false"
          SPRING_REDIS_HOST: 127.0.0.1
          SPRING_REDIS_PORT: "6379"
          SPRING_REDIS_PASSWORD: ""
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: "6379"
          REDIS_PASSWORD: ""
          APP_CORS_ALLOWED_ORIGINS: http://localhost:3000
          APP_CORS_REQUIRE_HTTPS: "false"
          APP_AUTH_REFRESH_COOKIE_SECURE: "false"
          JWT_SECRET: ci-only-jwt-secret-change-me-32-bytes
          GOOGLE_CLIENT_ID: ci-google-client
          GOOGLE_CLIENT_SECRET: ci-google-secret
          GOOGLE_REDIRECT_URI: http://localhost:8080/login/oauth2/code/google
          APP_OAUTH2_SUCCESS_REDIRECT_URI: http://localhost:3000
          APP_OAUTH2_FAILURE_REDIRECT_URI: http://localhost:3000/login?error=true
          APP_OAUTH2_AUTHORIZED_REDIRECT_URI: http://localhost:3000
          FIREBASE_CONFIG_PATH: /tmp/ci-firebase.json
          WEBPUSH_PUBLIC_KEY: ci-webpush-public
          WEBPUSH_PRIVATE_KEY: ci-webpush-private
          WEBPUSH_SUBJECT: mailto:ci@example.test
          DISCORD_BOT_TOKEN: ""
          DISCORD_CLIENT_ID: ""
          DISCORD_CLIENT_SECRET: ""
          DISCORD_REDIRECT_URI: http://localhost:8080/api/v1/users/discord/callback
        run: |
          printf '{}' > /tmp/ci-firebase.json
          ./gradlew clean check migrationTest bootJar --no-daemon

      - name: QEMU 설정
        if: needs.changes.outputs.docker_image == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Buildx 설정
        if: needs.changes.outputs.docker_image == 'true'
        uses: docker/setup-buildx-action@v3

      - name: ARM64 이미지 빌드 검증
        if: needs.changes.outputs.docker_image == 'true'
        uses: docker/build-push-action@v6
        with:
          context: apps/server
          file: apps/server/Dockerfile
          platforms: linux/arm64
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  result:
    name: CI
    if: always()
    needs: [changes, infra, web, server]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 필수 검증 결과 확인
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          INFRA_RESULT: ${{ needs.infra.result }}
          WEB_RESULT: ${{ needs.web.result }}
          SERVER_RESULT: ${{ needs.server.result }}
        run: |
          for result in "${CHANGES_RESULT}" "${INFRA_RESULT}" "${WEB_RESULT}" "${SERVER_RESULT}"; do
            case "${result}" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
